[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "text-processing-rs"
requires-python = ">=3.9"
readme = "README.md"
dynamic = ["version", "description", "license"]
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES.md"]

[tool.maturin]
bindings = "pyo3"
features = ["python", "fst-engine", "pyo3/abi3-py39"]
module-name = "text_processing_rs"
