name: Python release wheels

on:
  release:
    types: [published]
  push:
    branches:
      - 'release-recovery/v*'

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.event.release.id || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release source
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release-id: ${{ steps.release.outputs.release-id }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Identify the published release and its commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_ID: ${{ github.event.release.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            tag=$EVENT_TAG
            release_id=$EVENT_RELEASE_ID
            commit=$GITHUB_SHA
          else
            tag=${GITHUB_REF_NAME#release-recovery/}
            release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq 'select(.draft == false) | .id')
            commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags%2F$tag" --jq .sha)
          fi
          test -n "$release_id"
          test -n "$commit"
          printf 'tag=%s\nrelease-id=%s\ncommit=%s\n' "$tag" "$release_id" "$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            sdist: --sdist
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: macos-15-intel
            target: universal2-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.16.0
          args: >-
            --locked --release --compatibility pypi --out dist
            --features python,pyo3/abi3-py39 ${{ matrix.sdist }}
      - name: Test installed wheel
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I scripts/check-python-wheel.py
      - name: Verify both macOS architectures
        if: matrix.target == 'universal2-apple-darwin'
        run: |
          extension=$(python -I -c 'import text_processing_rs.text_processing_rs as native; print(native.__file__)')
          lipo "$extension" -verify_arch x86_64 arm64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  attach:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Attach distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_ID: ${{ needs.resolve.outputs.release-id }}
        run: |
          uploaded=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.state == "uploaded") | .name')
          for file in dist/*.whl dist/*.tar.gz; do
            name=${file##*/}
            if grep -Fxq -- "$name" <<< "$uploaded"; then
              printf 'Already attached %s\n' "$name"
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done

  publish-pypi:
    name: Publish to PyPI
    needs: attach
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/text-processing-rs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
