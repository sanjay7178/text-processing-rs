name: Python release wheels

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            sdist: --sdist
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build distribution
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          maturin-version: v1.16.0
          args: >-
            --locked --release --compatibility pypi --out dist
            --features python,pyo3/abi3-py39 ${{ matrix.sdist }}
      - name: Test installed wheel
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I scripts/check-python-wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - name: Attach distributions to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          uploaded=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | select(.state == "uploaded") | .name')
          for file in dist/*.whl dist/*.tar.gz; do
            name=${file##*/}
            if grep -Fxq -- "$name" <<< "$uploaded"; then
              printf 'Already attached %s\n' "$name"
            else
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done

  publish-pypi:
    name: Publish to PyPI
    needs: attach
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/text-processing-rs/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
